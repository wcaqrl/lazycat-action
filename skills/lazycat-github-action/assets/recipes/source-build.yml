# Requires a root upstream Dockerfile; otherwise implement the actual source build in the adapter. Set toolchains: docker.
version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.example.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/example/application.git
  select:
    strategy: branch-head
    branch: auto
changelog:
  mode: git-commits
  git_url: https://github.com/example/application.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: false
  prepare:
    mode: command
    command: docker buildx build --platform "$LAZYCAT_TARGET_PLATFORM" --tag "$LAZYCAT_OUTPUT_IMAGE"
      --push "$LAZYCAT_SOURCE_DIR"
    output_image: ghcr.io/example/application-lazycat:{version}-{fingerprint}
images:
- id: app
  target: service
  service: app
  source: ghcr.io/example/application-lazycat
  delivery:
    mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    continue_if_newer_version: true
    create_if_missing: false
