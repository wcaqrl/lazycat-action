# Copy this whole directory over the starter. Choose the database version required by upstream.
version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.example.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/example/application.git
  select:
    strategy: semver-tag
    tag_regex: ^v?[0-9]+\.[0-9]+\.[0-9]+$
changelog:
  mode: github-release
  git_url: https://github.com/example/application.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: false
  prepare:
    mode: images
images:
- id: app
  target: service
  service: app
  source: ghcr.io/example/application:{source_version}
  delivery:
    mode: lazycat
- id: worker
  target: service
  service: worker
  source: ghcr.io/example/application-worker:{source_version}
  delivery:
    mode: lazycat
- id: database
  target: service
  service: database
  source: docker.io/postgres:17
  delivery:
    mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    continue_if_newer_version: true
    create_if_missing: false
