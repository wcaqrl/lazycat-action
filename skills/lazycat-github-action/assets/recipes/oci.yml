# Replace the starter recipe when the official versioned image is authoritative.
version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.example.lpk
  target_arch: amd64
source:
  kind: oci
  image: ghcr.io/example/application
  select:
    strategy: semver-tag
    channel: stable
    tag_regex: ^v?[0-9]+\.[0-9]+\.[0-9]+$
changelog:
  mode: git-commits
  git_url: https://github.com/example/application.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: false
  prepare:
    mode: passthrough
images:
- id: app
  target: service
  service: app
  source: ghcr.io/example/application
  delivery:
    mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    continue_if_newer_version: true
    create_if_missing: false
