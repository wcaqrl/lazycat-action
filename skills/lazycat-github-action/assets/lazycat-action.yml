version: 2

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

source:
  kind: git
  url: git@gitee.com:example/application.git
  auth_ref: source
  select:
    strategy: branch-head
    branch: auto

state:
  file: .lazycat-action.lock.yml

update:
  strategy: publish
  allow_downgrade: false

build:
  run_buildscript: true
  prepare:
    mode: command
    context: scripts
    command: ./scripts/build-source.sh

stores:
  official:
    enabled: true
    create_if_missing: false
    skip_if_version_exists: true
    changelog_locales: [zh, en]
