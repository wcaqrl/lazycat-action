version: 1

project:
  root: targets/poster
  build_config: lzc-build.yml
  package_file: package.yml
  output: lpk/peter.lazycat.app.poster.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: poster

build:
  run_buildscript: false

images:
  - id: poster
    target: service
    service: poster
    source: ghcr.io/wcaqrl/poster
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    continue_if_newer_version: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: 海报实验室
      brief: 用于验证懒猫应用自动发布链路的 React 海报应用
      description: 展示响应式海报作品，并验证 Docker 镜像更新、官方镜像转存、LPK 构建与应用商店审核的完整自动化流程。
      keywords: React, 海报, 自动发布
      source: https://github.com/wcaqrl/poster
      source_author: wcaqrl
      support_pc: true
      support_mobile: false
      screenshot_pc_files:
        - screenshots/poster-desktop-1.png
        - screenshots/poster-desktop-2.png
  private:
    enabled: false
