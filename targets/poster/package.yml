package: peter.lazycat.app.poster
version: 0.1.0
name: Poster Lab
description: 用于验证 Docker 镜像到懒猫应用商店自动发布流程的 React 海报应用
author: Peter
license: MIT
homepage: https://github.com/wcaqrl/poster
min_os_version: 1.5.0
locales:
  zh-CN:
    name: 海报实验室
    description: 展示响应式海报作品，并验证镜像更新、LPK 构建和应用商店审核的自动化流程
    usage: |
      打开应用即可浏览海报作品；
      本应用用于验证懒猫应用自动发布流程。
  en-US:
    name: Poster Lab
    description: A responsive poster gallery used to validate automated image, LPK, and app-store releases
    usage: |
      Open the app to browse the poster gallery;
      This app validates the automated LazyCat release workflow.
manifest: ./lzc-manifest.yml
icon: ./lzc-icon.png
pkgout: ./lpk
