name: LazyCat official store automation

on:
  workflow_call:
    inputs:
      config:
        description: Path to the platform-neutral LazyCat pipeline configuration.
        type: string
        required: false
        default: .github/lazycat-action.yml
      operation:
        description: auto, check, build, or publish-official.
        type: string
        required: false
        default: auto
      runner:
        description: Linux Runner label.
        type: string
        required: false
        default: ubuntu-latest
      image-id:
        description: Optional legacy version 1 image ID.
        type: string
        required: false
        default: ""
      version:
        description: Optional manual application SemVer.
        type: string
        required: false
        default: ""
      changelog:
        description: Official store review changelog.
        type: string
        required: false
        default: ""
      dry-run:
        description: Discover and plan without changing files or remote state.
        type: boolean
        required: false
        default: false
      toolchains:
        description: Comma-separated subset of go,node,rust,docker.
        type: string
        required: false
        default: none
      go-version:
        type: string
        required: false
        default: ""
      node-version:
        type: string
        required: false
        default: ""
      rust-toolchain:
        type: string
        required: false
        default: ""
      node-package-manager:
        description: npm, pnpm, or yarn.
        type: string
        required: false
        default: npm
      enable-qemu:
        type: boolean
        required: false
        default: true
      docker-mirror:
        description: Optional Docker Hub mirror registry/path prefix.
        type: string
        required: false
        default: ""
      ghcr-mirror:
        description: Optional GHCR mirror registry/path prefix.
        type: string
        required: false
        default: ""
      registry-mirrors:
        description: Optional comma-separated registry=mirror-prefix mappings.
        type: string
        required: false
        default: ""
    secrets:
      LZC_API_HOST:
        required: false
      LZC_API_TOKEN:
        required: false
      LAZYCAT_TOKEN:
        required: false
      SOURCE_SSH_KEY:
        required: false
      SOURCE_KNOWN_HOSTS:
        required: false
      SOURCE_TOKEN:
        required: false
      SOURCE_USERNAME:
        required: false
      REGISTRY:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
    outputs:
      operation:
        value: ${{ jobs.lazycat.outputs.operation }}
      changed:
        value: ${{ jobs.lazycat.outputs.changed }}
      package-id:
        value: ${{ jobs.lazycat.outputs.package-id }}
      package-file:
        value: ${{ jobs.lazycat.outputs.package-file }}
      manifest-file:
        value: ${{ jobs.lazycat.outputs.manifest-file }}
      version:
        value: ${{ jobs.lazycat.outputs.version }}
      tag:
        value: ${{ jobs.lazycat.outputs.tag }}
      lpk-path:
        value: ${{ jobs.lazycat.outputs.lpk-path }}
      sha256:
        value: ${{ jobs.lazycat.outputs.sha256 }}
      image-results:
        value: ${{ jobs.lazycat.outputs.image-results }}
      source-result:
        value: ${{ jobs.lazycat.outputs.source-result }}
      fingerprint:
        value: ${{ jobs.lazycat.outputs.fingerprint }}
      state-file:
        value: ${{ jobs.lazycat.outputs.state-file }}
      store-results:
        value: ${{ jobs.lazycat.outputs.store-results }}
      official-store-enabled:
        value: ${{ jobs.lazycat.outputs.official-store-enabled }}
      official-review-pending:
        value: ${{ jobs.lazycat.outputs.official-review-pending }}
      official-review-version:
        value: ${{ jobs.lazycat.outputs.official-review-version }}
      update-strategy:
        value: ${{ jobs.lazycat.outputs.update-strategy }}
      channel:
        value: ${{ jobs.lazycat.outputs.channel }}
      result-file:
        value: ${{ jobs.lazycat.outputs.result-file }}
      runner-arch:
        value: ${{ jobs.lazycat.outputs.runner-arch }}
      target-platform:
        value: ${{ jobs.lazycat.outputs.target-platform }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lazycat-${{ github.repository }}-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  lazycat:
    runs-on: ${{ inputs.runner }}
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      LAZYCAT_DOCKER_MIRROR: ${{ inputs.docker-mirror || vars.LAZYCAT_DOCKER_MIRROR }}
      LAZYCAT_GHCR_MIRROR: ${{ inputs.ghcr-mirror || vars.LAZYCAT_GHCR_MIRROR }}
      LAZYCAT_REGISTRY_MIRRORS: ${{ inputs.registry-mirrors || vars.LAZYCAT_REGISTRY_MIRRORS }}
    outputs:
      operation: ${{ steps.lazycat.outputs.operation }}
      changed: ${{ steps.lazycat.outputs.changed }}
      package-id: ${{ steps.lazycat.outputs.package-id }}
      package-file: ${{ steps.lazycat.outputs.package-file }}
      manifest-file: ${{ steps.lazycat.outputs.manifest-file }}
      version: ${{ steps.lazycat.outputs.version }}
      tag: ${{ steps.lazycat.outputs.tag }}
      lpk-path: ${{ steps.lazycat.outputs.lpk-path }}
      sha256: ${{ steps.lazycat.outputs.sha256 }}
      image-results: ${{ steps.lazycat.outputs.image-results }}
      source-result: ${{ steps.lazycat.outputs.source-result }}
      fingerprint: ${{ steps.lazycat.outputs.fingerprint }}
      state-file: ${{ steps.publish.outputs.state-file || steps.lazycat.outputs.state-file }}
      store-results: ${{ steps.publish.outputs.store-results || steps.lazycat.outputs.store-results }}
      official-store-enabled: ${{ steps.lazycat.outputs.official-store-enabled }}
      official-review-pending: ${{ steps.publish.outputs.official-review-pending || steps.lazycat.outputs.official-review-pending }}
      official-review-version: ${{ steps.publish.outputs.official-review-version || steps.lazycat.outputs.official-review-version }}
      update-strategy: ${{ steps.lazycat.outputs.update-strategy }}
      channel: ${{ steps.lazycat.outputs.channel }}
      result-file: ${{ steps.publish.outputs.result-file || steps.lazycat.outputs.result-file }}
      runner-arch: ${{ steps.lazycat.outputs.runner-arch }}
      target-platform: ${{ steps.lazycat.outputs.target-platform }}
    steps:
      - name: Checkout pipeline project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize toolchains
        id: toolchains
        shell: bash
        env:
          TOOLCHAINS: ${{ inputs.toolchains }}
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          NODE_PACKAGE_MANAGER: ${{ inputs.node-package-manager }}
        run: |
          set -euo pipefail
          value="$(tr '[:upper:]' '[:lower:]' <<<"${TOOLCHAINS}" | tr -d '[:space:]')"
          if [[ -z "${value}" || "${value}" == "none" ]]; then value=""; fi
          IFS=',' read -ra entries <<<"${value}"
          for entry in "${entries[@]}"; do
            case "${entry}" in ""|go|node|rust|docker) ;; *) echo "unsupported toolchain ${entry}" >&2; exit 1 ;; esac
          done
          if [[ ",${value}," == *",rust,"* && -z "${RUST_TOOLCHAIN}" && ! -f rust-toolchain.toml ]]; then
            echo "rust-toolchain input or rust-toolchain.toml is required when rust is selected" >&2
            exit 1
          fi
          case "${NODE_PACKAGE_MANAGER}" in npm|pnpm|yarn) ;; *) echo "unsupported node package manager ${NODE_PACKAGE_MANAGER}" >&2; exit 1 ;; esac
          echo "value=,${value}," >>"${GITHUB_OUTPUT}"
          echo "normalized=${value:-none}" >>"${GITHUB_OUTPUT}"

      - name: Set up Go from input
        if: contains(steps.toolchains.outputs.value, ',go,') && inputs.go-version != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Set up Go from go.mod
        if: contains(steps.toolchains.outputs.value, ',go,') && inputs.go-version == ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node from input
        if: contains(steps.toolchains.outputs.value, ',node,') && inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-package-manager == 'npm' && 'npm' || '' }}

      - name: Set up Node from .node-version
        if: contains(steps.toolchains.outputs.value, ',node,') && inputs.node-version == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: ${{ inputs.node-package-manager == 'npm' && 'npm' || '' }}

      - name: Enable Node package manager
        if: contains(steps.toolchains.outputs.value, ',node,') && inputs.node-package-manager != 'npm'
        shell: bash
        env:
          NODE_PACKAGE_MANAGER: ${{ inputs.node-package-manager }}
        run: corepack enable "${NODE_PACKAGE_MANAGER}"

      - name: Read Rust toolchain file
        id: rust-toolchain-file
        if: contains(steps.toolchains.outputs.value, ',rust,') && inputs.rust-toolchain == ''
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
          if [[ -z "${channel}" ]]; then
            echo "rust-toolchain.toml does not define toolchain.channel" >&2
            exit 1
          fi
          echo "value=${channel}" >>"${GITHUB_OUTPUT}"

      - name: Set up Rust
        if: contains(steps.toolchains.outputs.value, ',rust,')
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ inputs.rust-toolchain != '' && inputs.rust-toolchain || steps.rust-toolchain-file.outputs.value }}
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Log in to build Registry
        if: env.REGISTRY != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        if: contains(steps.toolchains.outputs.value, ',docker,') && inputs.enable-qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        if: contains(steps.toolchains.outputs.value, ',docker,')
        uses: docker/setup-buildx-action@v4

      - name: Determine source date
        id: source-date
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Run LazyCat pipeline
        id: lazycat
        uses: wcaqrl/lazycat-action@v1
        env:
          LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
          LAZYCAT_TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
          LAZYCAT_AUTH_SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          LAZYCAT_AUTH_SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          LAZYCAT_AUTH_SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          LAZYCAT_AUTH_SOURCE_USERNAME: ${{ secrets.SOURCE_USERNAME }}
          LAZYCAT_WORKFLOW_TOOLCHAINS: ${{ steps.toolchains.outputs.normalized }}
          LAZYCAT_WORKFLOW_GO_VERSION: ${{ inputs.go-version }}
          LAZYCAT_WORKFLOW_NODE_VERSION: ${{ inputs.node-version }}
          LAZYCAT_WORKFLOW_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}
        with:
          operation: ${{ inputs.operation }}
          config: ${{ inputs.config }}
          image-id: ${{ inputs.image-id }}
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}
          dry-run: ${{ inputs.dry-run }}

      - name: Upload validated LPK
        if: steps.lazycat.outputs.lpk-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: lpk-${{ steps.lazycat.outputs.package-id }}-${{ steps.lazycat.outputs.version }}
          path: ${{ steps.lazycat.outputs.lpk-path }}
          if-no-files-found: error

      - name: Create source update pull request
        if: steps.lazycat.outputs.changed == 'true' && steps.lazycat.outputs.update-strategy == 'pull' && !inputs.dry-run
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: lazycat/source-update
          add-paths: |
            ${{ steps.lazycat.outputs.package-file }}
            ${{ steps.lazycat.outputs.manifest-file }}
            ${{ steps.lazycat.outputs.state-file }}
          delete-branch: true
          commit-message: "chore: update LazyCat application to ${{ steps.lazycat.outputs.version }}"
          title: "chore: update LazyCat application to ${{ steps.lazycat.outputs.version }}"
          body: |
            Automated source update.

            - Version: `${{ steps.lazycat.outputs.version }}`
            - Fingerprint: `${{ steps.lazycat.outputs.fingerprint }}`
            - Target: `${{ steps.lazycat.outputs.target-platform }}`

      - name: Commit packaged official update
        id: packaged-commit
        if: steps.lazycat.outputs.changed == 'true' && steps.lazycat.outputs.update-strategy == 'publish' && steps.lazycat.outputs.lpk-path != '' && !inputs.dry-run
        shell: bash
        env:
          VERSION: ${{ steps.lazycat.outputs.version }}
          PACKAGE_FILE: ${{ steps.lazycat.outputs.package-file }}
          MANIFEST_FILE: ${{ steps.lazycat.outputs.manifest-file }}
          STATE_FILE: ${{ steps.lazycat.outputs.state-file }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          paths=("${PACKAGE_FILE}" "${MANIFEST_FILE}")
          if [[ -n "${STATE_FILE}" ]]; then paths+=("${STATE_FILE}"); fi
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: package LazyCat application ${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish to LazyCat official store
        id: publish
        if: steps.lazycat.outputs.update-strategy == 'publish' && steps.lazycat.outputs.official-store-enabled == 'true' && steps.lazycat.outputs.lpk-path != '' && steps.lazycat.outputs.official-review-pending != 'true' && !inputs.dry-run
        uses: wcaqrl/lazycat-action@v1
        env:
          LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
          LAZYCAT_TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
          LAZYCAT_GUARD_OFFICIAL_REVIEW: "true"
        with:
          operation: publish-official
          config: ${{ inputs.config }}
          version: ${{ steps.lazycat.outputs.version }}
          changelog: ${{ inputs.changelog || format('Release {0}', steps.lazycat.outputs.version) }}
          lpk-path: ${{ steps.lazycat.outputs.lpk-path }}
          sha256: ${{ steps.lazycat.outputs.sha256 }}

      - name: Commit submitted state
        if: steps.publish.outcome == 'success' && steps.publish.outputs.state-file != '' && !inputs.dry-run
        shell: bash
        env:
          STATE_FILE: ${{ steps.publish.outputs.state-file }}
          VERSION: ${{ steps.lazycat.outputs.version }}
        run: |
          set -euo pipefail
          git add -- "${STATE_FILE}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record LazyCat submission ${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
